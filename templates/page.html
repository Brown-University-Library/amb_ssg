{% extends "amb-base.html" %}

{% block amb_content %}
<article class="amb-prose">
    <header class="amb-page-header">
        {% if page.extra.eyebrow %}
        <p class="amb-eyebrow">{{ page.extra.eyebrow }}</p>
        {% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.description %}
        <p class="amb-page-intro">{{ page.description }}</p>
        {% endif %}
    </header>
    <div class="amb-prose__body">
        {{ page.content | safe }}
    </div>
</article>
{% endblock amb_content %}
