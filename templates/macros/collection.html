{% macro record_card(page, compact=false) %}
<article class="record-card{% if compact %} record-card--compact{% endif %}">
    <a
        class="record-card__image-link"
        href="{{ page.permalink }}"
        aria-label="View the catalog record for {{ page.title }}"
    >
        {% if page.extra.has_image %}
        <img
            class="record-card__image"
            src="{{ get_url(path=page.extra.image) }}"
            alt="{{ page.extra.image_alt }}"
            loading="lazy"
            decoding="async"
        >
        {% else %}
        <span class="record-card__placeholder" aria-hidden="true">Image unavailable</span>
        {% endif %}
    </a>
    <div class="record-card__body">
        <p class="record-card__id">{{ page.extra.item_id }}</p>
        <h3 class="record-card__title">
            <a href="{{ page.permalink }}">{{ page.title }}</a>
        </h3>
        <p class="record-card__artist">{{ page.extra.artist }}</p>
        {% if page.extra.artist_dates %}
        <p class="record-card__dates">{{ page.extra.artist_dates }}</p>
        {% endif %}
    </div>
</article>
{% endmacro record_card %}
